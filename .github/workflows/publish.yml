name: Publish sanctions address lists
# Runs the full pipeline against live sources and keeps published data up to
# date with the results:
#   - CSV/JSON/TXT assets are only re-uploaded when a source's address list
#     actually changed since the last publish (byte-compared against the
#     currently published release, see the "Check for changes" step below).
#   - Releases are immutable: on a changed day, a new release (tag
#     data-YYYY-MM-DD) is published and marked "Latest". Nothing is published
#     on a no-change day, so manifest.json reflects the run that published it;
#     daily run health is visible in the Actions run history.
#   - A source that fails doesn't block the others: whatever succeeded still
#     gets published, and the job is marked failed for visibility.

on:
  schedule:
    # 04:17 UTC, daily. Off-the-hour to avoid the traffic spike most
    # scheduled workflows create by running exactly on the hour.
    - cron: "17 4 * * *"
  # Lets a maintainer trigger this manually from the Actions tab (or `gh
  # workflow run publish.yml`) instead of waiting for the next schedule.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Run all sources and generate outputs
        id: run_sources
        run: sanctions-address-lists run --output-dir dist
      - name: Validate outputs are not unexpectedly empty
        if: always() && steps.run_sources.outcome != 'cancelled'
        run: |
          set -euo pipefail
          test -s dist/manifest.json
          shopt -s nullglob
          files=(dist/csv/*.csv dist/json/*.json dist/txt/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no output files were generated by any source"
            exit 1
          fi
          for f in "${files[@]}"; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
          done
      - name: Check for changes vs the current release
        # Compares today's CSV/JSON/TXT against what's already published, so a
        # day with no actual address changes doesn't create a no-op release
        # update. manifest.json is deliberately excluded from this comparison
        # -- it always carries a fresh retrieved_at/content_hash and would
        # otherwise never compare equal.
        id: diff
        if: always() && steps.run_sources.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-release
          # No tag argument: downloads whichever release is marked "Latest".
          if ! gh release download --repo "$GITHUB_REPOSITORY" \
              --dir /tmp/previous-release \
              --pattern "*.csv" --pattern "*.json" --pattern "*.txt" --clobber; then
            echo "::notice::no previous release found (or nothing downloaded) -- treating this run as changed"
          fi
          # manifest.json also matches *.json above -- exclude it from the diff.
          rm -f /tmp/previous-release/manifest.json

          changed=false
          changed_sources=()
          shopt -s nullglob
          for f in dist/csv/*.csv dist/json/*.json dist/txt/*.txt; do
            name="$(basename "$f")"
            if [ ! -f "/tmp/previous-release/$name" ] || ! cmp -s "$f" "/tmp/previous-release/$name"; then
              echo "changed: $name"
              changed=true
              changed_sources+=("${name%.*}")
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

          # Same source's csv/json/txt always change together (all derived
          # from the same address set), so dedupe down to source IDs for a
          # readable release-notes summary.
          if [ ${#changed_sources[@]} -gt 0 ]; then
            unique_sources="$(printf '%s\n' "${changed_sources[@]}" | sort -u | paste -sd, -)"
          else
            unique_sources=""
          fi
          echo "changed_sources=$unique_sources" >> "$GITHUB_OUTPUT"

      - name: Publish snapshot release (lists changed)
        # Releases are immutable, so each change gets its own new release
        # (tag data-YYYY-MM-DD) marked as "Latest"; consumers use the stable
        # /releases/latest/download/<file> URLs. Assets can only be attached
        # while a release is a draft, so: create draft -> upload -> publish.
        # Publish whatever succeeded even if a gating source failed above, so a
        # single broken source doesn't withhold every other source's update.
        # The job's overall status still reflects the failure for visibility.
        if: always() && steps.run_sources.outcome != 'cancelled' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED_SOURCES: ${{ steps.diff.outputs.changed_sources }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(dist/csv/*.csv dist/json/*.json dist/txt/*.txt dist/manifest.json)

          today="$(date -u +%Y-%m-%d)"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tag="data-$today"
          # A published tag can never be reused, so a second change on the
          # same day (e.g. a manual re-run) gets a time-suffixed tag.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="data-$(date -u +%Y-%m-%dT%H%M%SZ)"
          fi
          title="Sanctions address lists: $today"
          notes="Snapshot of the generated address lists as of $timestamp. Changed sources: ${CHANGED_SOURCES:-(none detected)}. See manifest.json for per-source status, provenance, and counts."

          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes"
          # Drafts aren't immutable -- drop it if the upload fails, so a retry
          # starts clean.
          trap 'gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes || true' ERR
          gh release upload "$tag" "${FILES[@]}" --repo "$GITHUB_REPOSITORY"
          trap - ERR
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
