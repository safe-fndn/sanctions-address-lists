[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctions-address-lists"
version = "0.1.0"
description = "Download official sanctions lists and extract explicitly-published EVM addresses, separated by source."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Safe Research" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27,<0.29",
    "defusedxml>=0.7.1,<0.8",
]

[project.scripts]
sanctions-address-lists = "sanctions_address_lists.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<0.9",
    "mypy>=1.11,<2.0",
    "pytest>=8.3,<9.0",
    "respx>=0.21,<0.23",
    "types-defusedxml>=0.7,<0.8",
]

[project.urls]
Homepage = "https://github.com/safe-fndn/sanctions-address-lists"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["sanctions_address_lists"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: hits live government endpoints, excluded by default",
]
testpaths = ["tests"]
